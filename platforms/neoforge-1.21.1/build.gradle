plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

ext.platformLoader = 'neoforge'
apply from: '../../gradle/platform.gradle'
apply from: '../../gradle/fml-common.gradle'

repositories {
    mavenCentral()
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}
dependencies {
    implementation "net.neoforged:neoforge:${loader_version}"
    compileOnly 'curse.maven:irons-spells-n-spellbooks-855414:8680204' // NeoForge 1.21.1, 3.16.3
    compileOnly 'curse.maven:lendercataclysm-551586:8931182' // NeoForge 1.21.1, 3.33
    compileOnly 'curse.maven:the-twilight-forest-227639:7797302' // NeoForge 1.21.1, 4.8.3345
}

runs {
    configureEach {
        workingDirectory layout.projectDirectory.dir('run').dir(name)
        modSource sourceSets.main
    }
    client {}
    server { argument '--nogui' }
    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('../../common/src/generated/resources').absolutePath, '--existing', file('../../common/src/main/resources').absolutePath
        systemProperty 'yagens_attributes.datagenInput', file('../../common/src/datagen/resources').absolutePath
        systemProperty 'yagens_attributes.polarityInput', file('../../art/polarity').absolutePath
    }
}

sourceSets {
    adapterTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('adapterTest', JavaExec) {
    dependsOn tasks.named('adapterTestClasses')
    classpath = sourceSets.adapterTest.runtimeClasspath
    mainClass = 'yagen.waitmydawn.yagens_attributes.data.AdapterTests'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
tasks.named('check') { dependsOn tasks.named('adapterTest') }

def statusIconSources = providers.gradleProperty('statusIconSources').getOrElse('')
tasks.register('compareStatusIcons', JavaExec) {
    dependsOn tasks.named('adapterTestClasses')
    classpath = sourceSets.adapterTest.runtimeClasspath
    mainClass = 'yagen.waitmydawn.yagens_attributes.data.StatusIconPreview'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args(statusIconSources.isEmpty() ? '' : file(statusIconSources).absolutePath,
            layout.buildDirectory.file('ui-preview/status-icons-comparison.png').get().asFile.absolutePath)
    doFirst { if (statusIconSources.isEmpty()) throw new GradleException('Pass -PstatusIconSources=<directory with original 16px icons>') }
}

// These outputs contain absolute dependency paths and cannot be reused across Gradle cache roots.
def minecraftClasspathCacheRoot = gradle.gradleUserHomeDir.absolutePath
tasks.matching { it.name.startsWith('writeMinecraftClasspath') }.configureEach {
    inputs.property('minecraftClasspathCacheRoot', minecraftClasspathCacheRoot)
}
