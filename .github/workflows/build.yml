name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'neoforge-1.21.1'
            java: '21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: platforms/${{ matrix.platform }}
        run: bash ./gradlew --no-daemon build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release artifact
        run: python scripts/verify.py --project . --target '${{ matrix.platform }}'
      - name: Verify combat resources
        run: python scripts/verify_combat_resources.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: platforms/${{ matrix.platform }}/build/libs/*-${{ matrix.platform }}-*.jar
          if-no-files-found: error
